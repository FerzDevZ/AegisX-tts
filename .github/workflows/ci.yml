name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install system deps (espeak-ng untuk G2P en)
        run: sudo apt-get update && sudo apt-get install -y espeak-ng

      - name: Install CPU torch + dev tools
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]" pyyaml safetensors

      - name: Gate 1 — ruff (lint)
        run: python -m ruff check aegisx_tts/ tests/

      - name: Gate 1 — mypy strict
        run: python -m mypy aegisx_tts/

      - name: Gate 2 — pytest
        run: python -m pytest tests/ -q --cov=aegisx_tts --cov-report=term-missing

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
